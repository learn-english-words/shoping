// ---------- المشهد الأساسي ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d0c3);

const renderer = new THREE.WebGLRenderer({ antialias:true });

// ---------- نظام المشي (FPS-style) ----------
let yaw = 0;      // نبدأ واجهين الجدار الخلفي فيه الأرفف؟ لا — نبدأ واجهين المحل
let pitch = 0;
const keys = {};
const stick={x:0,y:0,pointer:null};

addEventListener('keydown', e => {
 if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
 if(e.code === 'Escape') { closePanel(); return; }
 if(e.code === 'KeyE' && hoveredMesh) { selectProduct(hoveredMesh); return; }
 if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].includes(e.code)){e.preventDefault();keys[e.code]=true;}
});
addEventListener('blur',clearMovement);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearMovement();});
function clearMovement(){for(const k in keys)keys[k]=false;dragging=false;lookPointer=null;resetJoystick();}

addEventListener('keyup',   e => { keys[e.code] = false; });

// السحب للنظر حولك (بدون ما نخسر الضغط على المنتجات)
let dragging = false, lookPointer=null, lastX = 0, lastY = 0, moved = 0;

function onPointerDown(e) {
  if (document.getElementById("panel").classList.contains("open")) closePanel();
  if(dragging)return;
  lookPointer=e.pointerId;
  renderer.domElement.setPointerCapture(e.pointerId);
  dragging = true;
  moved = 0;
  lastX = e.clientX; lastY = e.clientY;
}
function onPointerMove(e) {
  if (!dragging || e.pointerId!==lookPointer) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  yaw   -= dx * 0.0042;
  pitch -= dy * 0.0042;
  pitch = Math.max(-1.35, Math.min(1.35, pitch)); // ما تنقلب الكاميرا
  lastX = e.clientX; lastY = e.clientY;
}
function onPointerUp(e) {
  if(!dragging||e.pointerId!==lookPointer)return;
  dragging = false;
  // إذا ما تحرك المؤشر تقريبًا = ضغطة → نفحص المنتجات
  if (moved > 8) return;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(productMeshes, false);
  if (hits.length) selectProduct(hits[0].object);
  else closePanel();
}

renderer.domElement.addEventListener('pointerdown', onPointerDown);
addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerup', onPointerUp);

function neonStrip(w, h, d, x, y, z, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color }));
  m.position.set(x, y, z);

function makeSign(text, color, size=90) {
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.font = `bold ${size}px Tahoma`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = 0;
  ctx.fillStyle = color;
  ctx.fillText(text, 512, 128);
  const tex = new THREE.CanvasTexture(cv);
  return new THREE.Mesh(new THREE.PlaneGeometry(10, 2.5),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true, side:THREE.DoubleSide }));
}

function makeShelfUnit(x, z, rotY, catName, catColor) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.userData.category=catName;
  g.rotation.y = rotY;

  const frameMat = new THREE.MeshStandardMaterial({ color:0x253347, roughness:0.6, metalness:.15 });
  const back = new THREE.Mesh(new THREE.BoxGeometry(5, 4.4, 0.15), frameMat);
  back.position.y = 2.2; back.castShadow = back.receiveShadow = true;
  g.add(back);

  const edge = new THREE.Mesh(new THREE.BoxGeometry(5.15, 4.55, 0.08),
    new THREE.MeshBasicMaterial({ color:0xbda783 }));
  edge.position.set(0, 2.2, -0.06);
  g.add(edge);

  for (let i = 0; i < 3; i++) {
    const sh = new THREE.Mesh(new THREE.BoxGeometry(5, 0.1, 1.1),
      new THREE.MeshStandardMaterial({ color:0x384b63, roughness:0.55, metalness:.25 }));
    sh.position.set(0, 0.9 + i * 1.6, 0.5);
    sh.castShadow = sh.receiveShadow = true;
    g.add(sh);
    const led=new THREE.Mesh(new THREE.BoxGeometry(4.8,.025,.025),new THREE.MeshBasicMaterial({color:0xffedd0}));
    led.position.set(0,.95+i*1.6,1.052);g.add(led);
  }

  const catSign = makeSign(catName, '#ffffff', 80);
  catSign.scale.set(0.35, 0.35, 0.35);
  catSign.position.set(0, 4.9, 0.3);
  g.add(catSign);
  g.userData.sign=catSign;

  scene.add(g);
  return g;
}

}
function productImage(p){return safeURL(p.image)||demoImage(p);}
function makeCardTexture(p){
 const cv=document.createElement('canvas');cv.width=512;cv.height=640;
 const ctx=cv.getContext('2d');
 const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;
 function paint(img){
  if(tex.userData.disposed)return;
  ctx.fillStyle='#edf2f8';ctx.fillRect(0,0,512,640);
  if(img){
   const s=Math.min(456/img.width,428/img.height);
   ctx.drawImage(img,(512-img.width*s)/2,20+(428-img.height*s)/2,img.width*s,img.height*s);
  }else{ctx.fillStyle='#718298';ctx.font='24px Tahoma';ctx.textAlign='center';ctx.fillText('جاري تحميل الصورة',256,225);}
  ctx.fillStyle='#101b2e';ctx.fillRect(0,466,512,174);
  ctx.textAlign='center';ctx.direction='rtl';ctx.fillStyle='#f4f8ff';ctx.font='bold 27px Tahoma';
  let label=p.name;while(ctx.measureText(label).width>465&&label.length>2)label=label.slice(0,-2)+'…';
  ctx.fillText(label,256,515);
  ctx.fillStyle='#d8c39e';ctx.font='bold 35px Tahoma';ctx.fillText(p.price+' ر.س',256,563);
  ctx.fillStyle='#a8bdd3';ctx.font='20px Tahoma';ctx.fillText(safeURL(p.image)?p.cat:'رسم تجريبي · '+p.cat,256,606);
  tex.needsUpdate=true;
 }
 paint();
 const img=new Image();img.crossOrigin='anonymous';
 img.onload=()=>paint(img);
 img.onerror=()=>{img.onerror=null;img.src=demoImage(p);};
 img.src=productImage(p);
 return tex;
}
function addProductToShelf(group,product,shelfIndex,slotIndex){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(1.18,1.45,.10),new THREE.MeshStandardMaterial({color:0x1d2939,emissive:0xbda783,emissiveIntensity:0,roughness:.5}));
 mesh.position.set(-1.65+slotIndex*1.65,1.7+shelfIndex*1.6,.72);
 mesh.userData.product=product;group.add(mesh);productMeshes.push(mesh);
 const front=new THREE.Mesh(new THREE.PlaneGeometry(1.10,1.375),new THREE.MeshBasicMaterial({map:makeCardTexture(product)}));
 front.position.z=.056;front.userData.product=product;front.userData.cardParent=mesh;mesh.add(front);productMeshes.push(front);
 const base=new THREE.Mesh(new THREE.BoxGeometry(1.27,.055,.35),new THREE.MeshBasicMaterial({color:0xbda783}));
 base.position.y=-.75;mesh.add(base);
}

// المنتجات تُعدّل من القائمة أعلاه. واجهة الزبون تعرض المحل فقط.
function renderProducts(){
 const used=new Map(units.map(u=>[u,0]));
 products.forEach(p=>{
  let candidates=units.filter(u=>u.userData.category===p.cat && used.get(u)<9);
  if(!candidates.length)candidates=units.filter(u=>used.get(u)<9);
  if(!candidates.length)return;

  const u=candidates[0],slot=used.get(u);
  addProductToShelf(u,p,Math.floor(slot/3),slot%3);used.set(u,slot+1);
 });
}

const joystick=document.getElementById('joystick');
const knob=document.getElementById('joystick-knob');
function resetJoystick(){
 const id=stick.pointer;stick.x=0;stick.y=0;stick.pointer=null;
 joystick.classList.remove('active');knob.style.transform='translate(-50%,-50%)';
 if(id!==null && joystick.hasPointerCapture(id))joystick.releasePointerCapture(id);
}
function moveJoystick(e){
 if(e.pointerId!==stick.pointer)return;
 const box=joystick.getBoundingClientRect();
 const radius=box.width*.27;
 let dx=e.clientX-(box.left+box.width/2),dy=e.clientY-(box.top+box.height/2);
 const distance=Math.hypot(dx,dy);
 if(distance>radius){dx*=radius/distance;dy*=radius/distance;}
 const magnitude=Math.min(1,distance/radius),deadZone=.12;
 const strength=magnitude<=deadZone?0:(magnitude-deadZone)/(1-deadZone);
 const angle=Math.atan2(dy,dx);
 stick.x=Math.cos(angle)*strength;stick.y=Math.sin(angle)*strength;
 knob.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
}
joystick.addEventListener('pointerdown',e=>{
 if(stick.pointer!==null || document.body.classList.contains('product-open'))return;
 e.preventDefault();stick.pointer=e.pointerId;joystick.setPointerCapture(e.pointerId);joystick.classList.add('active');moveJoystick(e);
});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===stick.pointer){e.preventDefault();moveJoystick(e);}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])joystick.addEventListener(event,e=>{if(e.pointerId===stick.pointer)resetJoystick();});
window.addEventListener('resize',resetJoystick);

const obstacles=units.map(u=>{
 u.updateMatrixWorld(true);
 const box=new THREE.Box3();
 for(const x of [-2.65,2.65])for(const z of [-.2,1.15])box.expandByPoint(u.localToWorld(new THREE.Vector3(x,0,z)));
 return box;
});
function blocked(x,z){return obstacles.some(b=>x>b.min.x-.35&&x<b.max.x+.35&&z>b.min.z-.35&&z<b.max.z+.35);}
let hoverTimer=0;
// ---------- الحلقة ----------
const clock = new THREE.Clock();
const EYE = 1.7;
const ROOM = 15; // حدود المحل

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // ====== الحركة WASD ======
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 8 : 4;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);        // للأمام
  const rx =  Math.cos(yaw), rz = -Math.sin(yaw);        // لليمين

  let mx = rx*stick.x-fx*stick.y, mz = rz*stick.x-fz*stick.y;
  if (keys['KeyW'] || keys['ArrowUp'])    { mx += fx; mz += fz; }
  if (keys['KeyS'] || keys['ArrowDown'])  { mx -= fx; mz -= fz; }
  if (keys['KeyD'] || keys['ArrowRight']) { mx += rx; mz += rz; }
  if (keys['KeyA'] || keys['ArrowLeft'])  { mx -= rx; mz -= rz; }

  if(document.getElementById("panel").classList.contains("open")){mx=0;mz=0;}
  const len = Math.hypot(mx, mz);
  if (len > 0) {
    
const nextX=camera.position.x+(mx/Math.max(1,len))*speed*dt;
    const nextZ=camera.position.z+(mz/Math.max(1,len))*speed*dt;
    if(!blocked(nextX,camera.position.z))camera.position.x=nextX;
    if(!blocked(camera.position.x,nextZ))camera.position.z=nextZ;
    bobT += dt * speed * 2.2; // اهتزاز خفيف أثناء المشي
  }

  // حدود المحل (ما تطلع من الجدران)
  camera.position.x = Math.max(-ROOM, Math.min(ROOM, camera.position.x));
  camera.position.z = Math.max(-ROOM, Math.min(ROOM, camera.position.z));

  camera.position.y = EYE + Math.sin(bobT) * 0.045;
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;



  hoverTimer+=dt;
  if(hoverTimer>.12){
   hoverTimer=0;camera.updateMatrixWorld();raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
   const hits=raycaster.intersectObjects(productMeshes,false);hoveredMesh=hits.length?hits[0].object:null;
  }
  renderer.render(scene,camera);
}
animate();

  camera.aspect = innerWidth / innerHeight;

  renderer.setSize(innerWidth, innerHeight);
});
