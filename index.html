<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0a0e; font-family:'Segoe UI', Tahoma, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  #loader { position:fixed; inset:0; background:#0a0a0e; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; transition:opacity .8s; }
  #loader h1 { color:#fff; font-size:clamp(30px,7vw,60px); letter-spacing:2px; text-shadow:0 0 10px #ff2fd6,0 0 40px #00f0ff; animation:pulse 1.6s ease-in-out infinite; }
  #loader p { color:#ffd9a0; font-size:14px; letter-spacing:5px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

  #header { position:fixed; top:0; right:0; left:0; z-index:10; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; background:linear-gradient(to bottom, rgba(10,10,14,.9), transparent); }
  #header .logo { color:#fff; font-size:22px; font-weight:700; text-shadow:0 0 12px #d4a94e; pointer-events:auto; }
  #hint { color:#f0ead8; font-size:12.5px; background:rgba(30,28,25,.55); border:1px solid rgba(212,169,78,.35); padding:8px 16px; border-radius:30px; backdrop-filter:blur(8px); pointer-events:auto; }
  #hint b { color:#ffd9a0; }

  #panel { position:fixed; top:50%; left:24px; transform:translate(-120%,-50%); width:min(340px,88vw); z-index:20; background:rgba(22,20,26,.9); backdrop-filter:blur(16px); border:1px solid rgba(212,169,78,.5); border-radius:20px; padding:24px; box-shadow:0 10px 50px rgba(0,0,0,.5); transition:transform .45s cubic-bezier(.2,.9,.3,1.2); }
  #panel.open { transform:translate(0,-50%); }
  #panel .close { position:absolute; top:12px; left:12px; width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,.25); background:transparent; color:#fff; cursor:pointer; font-size:16px; transition:.2s; }
  #panel .close:hover { background:#d4a94e; }
  #p-img { width:100%; height:140px; border-radius:14px; margin-bottom:14px; display:flex; align-items:center; justify-content:center; font-size:50px; background:rgba(255,255,255,.05); border:1px dashed rgba(212,169,78,.4); }
  #p-name { color:#fff; font-size:20px; font-weight:700; margin-bottom:6px; }
  #p-cat { color:#ffd9a0; font-size:12px; margin-bottom:10px; }
  #p-desc { color:#cfc8bb; font-size:14px; line-height:1.8; margin-bottom:12px; }
  #p-price { color:#d4a94e; font-size:26px; font-weight:800; margin-bottom:14px; }
  #p-price small { font-size:13px; color:#eee; font-weight:400; }
  .btn { display:block; width:100%; text-align:center; padding:14px; border-radius:12px; text-decoration:none; font-weight:700; font-size:15px; transition:.25s; cursor:pointer; border:none; }
  .btn-salla { background:linear-gradient(90deg,#d4a94e,#b8822f); color:#1a1408; }
  .btn-salla:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(212,169,78,.5); }

  #toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); z-index:30; color:#1a1408; font-size:15px; font-weight:600; background:linear-gradient(90deg,#ffd9a0,#d4a94e); padding:12px 28px; border-radius:30px; box-shadow:0 5px 25px rgba(212,169,78,.4); opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }
  #fade { position:fixed; inset:0; background:#000; z-index:40; opacity:0; transition:opacity .35s; pointer-events:none; }

  #zone-badge { position:fixed; bottom:20px; right:24px; z-index:10; color:#ffd9a0; font-size:12px; background:rgba(30,28,25,.6); border:1px solid rgba(212,169,78,.35); padding:8px 16px; border-radius:30px; backdrop-filter:blur(8px); }
  #keys { position:fixed; bottom:20px; left:24px; z-index:10; color:#e8e2d0; font-size:12px; background:rgba(30,28,25,.6); border:1px solid rgba(212,169,78,.3); padding:8px 16px; border-radius:30px; backdrop-filter:blur(8px); }
  #keys b { color:#ffd9a0; }

@media(max-height:500px){#mobile-stick{width:112px;height:112px;bottom:calc(12px + env(safe-area-inset-bottom));left:calc(12px + env(safe-area-inset-left))}#p-img{height:100px}#panel{padding:18px}}

<script type="module">
import * as THREE from 'three';

/* ============================================================
   ⬇️ إعداداتك — عدّل من هنا
   ============================================================ */
const SALLA_STORE_URL = "https://salla.sa/YOUR-STORE"; // رابط متجرك

/* 📢 الإعلانات — غيّر العناوين والروابط، أو استبدلها بصور:
   { img:"https://رابط-الصورة.jpg", url:"https://رابط-الإعلان" } */
const ADS = [
  { title:"🔥 عرض اليوم",   sub:"خصم 30% على جميع الكفرات",      img:null, url:SALLA_STORE_URL },
  { title:"🚚 شحن مجاني",   sub:"للطلبات فوق 200 ر.س",            img:null, url:SALLA_STORE_URL },
  { title:"🎧 وصل حديثًا",  sub:"سماعات الألعاب RGB برو",        img:null, url:SALLA_STORE_URL },
  { title:"📢 إعلانك هنا",  sub:"أجر مساحة إعلانية في المول",    img:null, url:"#" },
  { title:"⚡ باور بانك",   sub:"سعة 20000mAh — الكمية محدودة",   img:null, url:SALLA_STORE_URL },
  { title:"🛡️ حماية شاشة", sub:"تركيب مجاني داخل المحل",        img:null, url:SALLA_STORE_URL },
];

const products = [
  { id:"k1", name:"كفر نيون — آيفون 15",  price:59,  cat:"كفرات",     icon:"📱", color:0xff2fd6, desc:"كفر سيليكون مضاد للصدمات بتصميم نيون متوهج." },
  { id:"k2", name:"كفر شفاف ماجنتك",      price:45,  cat:"كفرات",     icon:"📱", color:0x00f0ff, desc:"يدعم MagSafe مع حواف مرتفعة للحماية." },
  { id:"k3", name:"كفر ألعاب LED",        price:79,  cat:"كفرات",     icon:"🎮", color:0x7b2ff7, desc:"إضاءة LED متغيرة مع أزرار إضافية." },
  { id:"s1", name:"سماعة بلوتوث Pro",     price:199, cat:"سماعات",    icon:"🎧", color:0x00ff9d, desc:"عزل ضوضاء نشط وبطارية 40 ساعة." },
  { id:"s2", name:"سماعات أذن لاسلكية",   price:149, cat:"سماعات",    icon:"🎧", color:0xffe600, desc:"جودة صوت استوديو ومقاومة ماء IPX5." },
  { id:"s3", name:"سماعة ألعاب RGB",      price:229, cat:"سماعات",    icon:"🎧", color:0xff2fd6, desc:"صوت محيطي 7.1 ومايك بإلغاء الضوضاء." },
  { id:"c1", name:"شاحن سريع 65W",        price:99,  cat:"شواحن",     icon:"🔌", color:0x00f0ff, desc:"شاحن GaN صغير بمنفذين USB-C وA." },
  { id:"c2", name:"كيبل مغناطيسي 3 في 1", price:39,  cat:"شواحن",     icon:"🔌", color:0x7b2ff7, desc:"يدعم Lightning وUSB-C وMicro." },
  { id:"c3", name:"باور بانك 20000mAh",   price:129, cat:"شواحن",     icon:"🔋", color:0x00ff9d, desc:"يشحن 3 أجهزة بنفس الوقت مع شاشة." },
  { id:"g1", name:"حماية شاشة سيراميك",   price:35,  cat:"حماية",     icon:"🛡️", color:0xffe600, desc:"ناعم الملمس مضاد للخدوش والبصمات." },
  { id:"g2", name:"عدسة حماية الكاميرا",  price:25,  cat:"حماية",     icon:"🛡️", color:0x00f0ff, desc:"حلقة معدنية لا تؤثر على جودة الصور." },
  { id:"g3", name:"جراب حماية عسكري",     price:69,  cat:"حماية",     icon:"🛡️", color:0xff2fd6, desc:"مقاوم للسقوط من 3 أمتار." },
  { id:"a1", name:"حامل سيارة مغناطيسي",  price:49,  cat:"إكسسوارات", icon:"🚗", color:0x7b2ff7, desc:"دوران 360 درجة وثبات عالي." },
  { id:"a2", name:"حامل مكتب ألمنيوم",    price:55,  cat:"إكسسوارات", icon:"🖥️", color:0x00ff9d, desc:"زوايا قابلة للتعديل للجوال والتابلت." },
  { id:"a3", name:"قلم لمس ذكي",          price:89,  cat:"إكسسوارات", icon:"✏️", color:0xffe600, desc:"دقة عالية وبطارية 10 ساعات." },
  { id:"a4", name:"استيكرات سكين نيون",   price:19,  cat:"إكسسوارات", icon:"✨", color:0xff2fd6, desc:"مقاومة للماء بتصاميم نيون متنوعة." },
];
/* ============================================================ */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0e);
scene.fog = new THREE.Fog(0x0a0a0e, 40, 110);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 250);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.7, 22);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------- أدوات نصوص ---------- */
function makeSign(text, color, size=90, w=1024, h=200) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.font = `bold ${size}px Tahoma`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = 20;
  ctx.fillStyle = color;
  ctx.fillText(text, w/2, h/2);
  const tex = new THREE.CanvasTexture(cv);
  return new THREE.Mesh(new THREE.PlaneGeometry(8, 1.6),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true, side:THREE.DoubleSide }));
}

/* ---------- إضاءة دافئة واقعية ---------- */
scene.add(new THREE.AmbientLight(0xfff2e0, 1.15));
const sun = new THREE.DirectionalLight(0xfff6e8, 1.3);
sun.position.set(12, 22, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
scene.add(sun);
// كرات إضاءة دافئة على طول الممرات
[[-9,4.6,0,0],[9,4.6,0,0],[-9,9.6,0,1],[9,9.6,0,1]].forEach(([x,y,z,f])=>{
  const pl = new THREE.PointLight(0xffe6c0, 45, 32);
  pl.position.set(x, y, z + (f? 0 : 0)); scene.add(pl);
});
const warmA = new THREE.PointLight(0xffe0b3, 40, 30); warmA.position.set(-9, 4.6, 0); scene.add(warmA);
const warmB = new THREE.PointLight(0xffe0b3, 40, 30); warmB.position.set(9, 4.6, 0); scene.add(warmB);
const warmC = new THREE.PointLight(0xffe0b3, 40, 30); warmC.position.set(-9, 9.6, 0); scene.add(warmC);
const warmD = new THREE.PointLight(0xffe0b3, 40, 30); warmD.position.set(9, 9.6, 0); scene.add(warmD);
const warmE = new THREE.PointLight(0xffe0b3, 35, 25); warmE.position.set(0, 9, 25); scene.add(warmE);
const warmF = new THREE.PointLight(0xffe0b3, 35, 25); warmF.position.set(0, 9, -25); scene.add(warmF);

/* ---------- ألوان واقعية ---------- */
const MAT = {
  floor:  new THREE.MeshStandardMaterial({ color:0xd9d2c4, roughness:0.25, metalness:0.08 }),
  slab:   new THREE.MeshStandardMaterial({ color:0xcfc8ba, roughness:0.4 }),
  wall:   new THREE.MeshStandardMaterial({ color:0xe9e2d2, roughness:0.9, side:THREE.BackSide }),
  ceil:   new THREE.MeshStandardMaterial({ color:0xf2ede2, roughness:0.95, side:THREE.BackSide }),
  gold:   new THREE.MeshStandardMaterial({ color:0xd4a94e, roughness:0.3, metalness:0.8 }),
  glass:  new THREE.MeshStandardMaterial({ color:0xbfe8ee, roughness:0.05, metalness:0.4, transparent:true, opacity:0.25 }),
  dark:   new THREE.MeshStandardMaterial({ color:0x2a2a30, roughness:0.5, metalness:0.6 }),
  escal:  new THREE.MeshStandardMaterial({ color:0x9aa0a8, roughness:0.35, metalness:0.85 }),
};

const HALL_W=26,HALL_L=70,FLOOR_Y=5,HALL_H=14;
const LEVEL_Y=FLOOR_Y+.2,CEILING_F0=FLOOR_Y-.2,CEILING_F1=FLOOR_Y+4.45;

/* ---------- قاعة المول (الجدران والسقف) ---------- */
const hall = new THREE.Mesh(new THREE.BoxGeometry(HALL_W, HALL_H, HALL_L), MAT.wall);
hall.position.y = HALL_H/2;
scene.add(hall);

/* بلاطة الطابق الأول مع فتحة الـ Atrium (x: -3..3, z: -2..8) */
function slab(w, d, x, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.4, d), MAT.slab);
  m.position.set(x, FLOOR_Y, z);
  m.receiveShadow = true; m.castShadow = true;
  scene.add(m);
}
slab(HALL_W, HALL_L/2 - 8, 0,  (8 + HALL_L/2)/2);      // أمام الفتحة
slab(HALL_W, HALL_L/2 - 2, 0, -(2 + HALL_L/2)/2);      // خلف الفتحة
slab(HALL_W/2 - 3, 10, -(HALL_W/2 + 3)/2, 3);          // يسار الفتحة
slab(HALL_W/2 - 3, 10,  (HALL_W/2 + 3)/2, 3);          // يمين الفتحة

/* أرضية الطابق الأرضي */
const gfloor = new THREE.Mesh(new THREE.PlaneGeometry(HALL_W, HALL_L), MAT.floor);
gfloor.rotation.x = -Math.PI/2; gfloor.position.y = 0.01;
gfloor.receiveShadow = true;
scene.add(gfloor);

/* سقف الطابق الأول (أرضية بلا فتحات بصرية — نخلي الفتحة مفتوحة للـ atrium) */
/* بلاطة السقف: نفس تقسيم الفتحة */
function ceilSlab(w, d, x, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.3, d), new THREE.MeshStandardMaterial({color:0xf2ede2,roughness:.95}));
  m.position.set(x, FLOOR_Y + 4.6, z);
  scene.add(m);
}
ceilSlab(HALL_W, HALL_L/2 - 8, 0,  (8 + HALL_L/2)/2);
ceilSlab(HALL_W, HALL_L/2 - 2, 0, -(2 + HALL_L/2)/2);
ceilSlab(HALL_W/2 - 3, 10, -(HALL_W/2 + 3)/2, 3);
ceilSlab(HALL_W/2 - 3, 10,  (HALL_W/2 + 3)/2, 3);

/* إضاءات سقف مدمجة (مظلات مضيئة) */
function ceilingLights(y) {
  for (let z = -30; z <= 30; z += 8) {
    for (const x of [-7, 0, 7]) {
      // تخطّ منطقة الفتحة للطابق الأول
      if(Math.abs(x)<3.2&&z>-5&&z<12)continue;
      const panel = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.08, 1.4),
        new THREE.MeshBasicMaterial({ color:0xfff6e6 }));
      panel.position.set(x,y===0?CEILING_F0-.15:CEILING_F1-.10,z);
      scene.add(panel);
    }
  }
}
ceilingLights(0);
ceilingLights(FLOOR_Y);

/* ---------- درابزين زجاجي حول الفتحة (طابق أول) ---------- */
function railing(w, d, x, z) {
  const g = new THREE.Group();
  const glassP = new THREE.Mesh(new THREE.BoxGeometry(w, 1.1, d), MAT.glass);
  glassP.position.y = 0.85; g.add(glassP);
  const railTop = new THREE.Mesh(new THREE.BoxGeometry(w + 0.06, 0.09, d + 0.06), MAT.gold);
  railTop.position.y = 1.42; g.add(railTop);
  g.position.set(x, FLOOR_Y + 0.2, z);
  scene.add(g);
}
railing(0.12, 10, -3, 3);   // يسار
railing(0.12, 10,  3, 3);   // يمين
// فتحات عند السلالم، مع درابزين بينهما وعلى الطرفين.
for(const z of [8,-2]){
 railing(.55,.12,-2.725,z);railing(.7,.12,0,z);railing(.55,.12,2.725,z);
}

/* ---------- السلم الكهربائي ---------- */
const STEP_COUNT = 18;
const ESC={xUp:-1.4,xDown:1.4,zBot:9.4,zTop:-2.8};
const escSteps = [];

function buildEscalator(x, goingUp) {
  const g = new THREE.Group();
  const dz = ESC.zTop - ESC.zBot;          // -10
  const dy = LEVEL_Y;                      // 5
  const len = Math.hypot(dz, dy);
  const angle = Math.atan2(dy, -dz);       // ميل السلم

  // الهيكل المائل
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, len + .3), MAT.escal);
  body.position.set(0, LEVEL_Y/2-.24, (ESC.zBot + ESC.zTop)/2);
  body.rotation.x = angle;
  g.add(body);

  // يدّين جانبية (مطاط أسود)
  for (const s of [-0.85, 0.85]) {
    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.25, len + .3),
      new THREE.MeshStandardMaterial({ color:0x1c1c20, roughness:0.6 }));
    hand.position.set(s, LEVEL_Y/2+.65, (ESC.zBot + ESC.zTop)/2);
    hand.rotation.x = angle;
    g.add(hand);
  }

  // الدرجات المتحركة
  for (let i = 0; i < STEP_COUNT; i++) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(1.3,.16,Math.abs(ESC.zTop-ESC.zBot)/STEP_COUNT+.07),
      new THREE.MeshStandardMaterial({ color:0xc8ccd2, roughness:0.3, metalness:0.9,
        emissive: goingUp ? 0x00ff9d : 0xff5555, emissiveIntensity: 0.06 }));
    g.add(st);
    escSteps.push({ mesh: st, off: i / STEP_COUNT, goingUp });
  }


  for(const [z,y] of [[ESC.zBot+.55,0],[ESC.zTop-.55,LEVEL_Y]]){
   const landing=new THREE.Mesh(new THREE.BoxGeometry(1.6,.12,1.4),MAT.escal);
   landing.position.set(0,y-.06,z);g.add(landing);
  }
  g.position.x=x;scene.add(g);
}

function makeAdTexture(ad, i) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 288;
  const ctx = cv.getContext('2d');
  if (ad.img) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = ad.img;
    img.onload = () => { ctx.drawImage(img, 0, 0, 512, 288); tex.needsUpdate = true; };
  }
  const hues = [340, 200, 160, 45, 20, 265];
  const h = hues[i % hues.length];
  const grd = ctx.createLinearGradient(0, 0, 512, 288);
  grd.addColorStop(0, `hsl(${h}, 65%, 22%)`);
  grd.addColorStop(1, `hsl(${(h+40)%360}, 70%, 38%)`);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, 512, 288);
  ctx.strokeStyle = `hsl(${h}, 90%, 65%)`; ctx.lineWidth = 8;
  ctx.strokeRect(8, 8, 496, 272);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 52px Tahoma';
  ctx.fillText(ad.title, 256, 128);
  ctx.font = '32px Tahoma';
  ctx.fillStyle = `hsl(${h}, 100%, 82%)`;
  ctx.fillText(ad.sub, 256, 195);
  const tex = new THREE.CanvasTexture(cv);
  return tex;
}

let yaw = 0, pitch = 0;

const keys={};
const stick={x:0,y:0,pointer:null};
const stickBase=document.getElementById('stick-base'),stickKnob=document.getElementById('stick-knob');
let transitioning=false,lookPointer=null;
function resetStick(){
 const id=stick.pointer;stick.x=0;stick.y=0;stick.pointer=null;
 stickBase.classList.remove('active');stickKnob.style.transform='translate(-50%,-50%)';
 if(id!==null&&stickBase.hasPointerCapture(id))stickBase.releasePointerCapture(id);
}
function clearMovement(){for(const k in keys)keys[k]=false;dragging=false;lookPointer=null;resetStick();}
function moveStick(e){
 if(stick.pointer!==e.pointerId)return;
 const r=stickBase.getBoundingClientRect(),radius=r.width*.27;
 let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
 const distance=Math.hypot(dx,dy);
 if(distance>radius){dx*=radius/distance;dy*=radius/distance;}
 const magnitude=Math.min(1,distance/radius),strength=magnitude<=.12?0:(magnitude-.12)/.88;
 const angle=Math.atan2(dy,dx);stick.x=Math.cos(angle)*strength;stick.y=Math.sin(angle)*strength;
 stickKnob.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
}
stickBase.addEventListener('pointerdown',e=>{
 if(stick.pointer!==null||riding||transitioning||document.body.classList.contains('panel-open'))return;
 e.preventDefault();stick.pointer=e.pointerId;stickBase.setPointerCapture(e.pointerId);stickBase.classList.add('active');moveStick(e);
});
stickBase.addEventListener('pointermove',e=>{if(e.pointerId===stick.pointer){e.preventDefault();moveStick(e);}});
for(const type of ['pointerup','pointercancel','lostpointercapture'])stickBase.addEventListener(type,e=>{if(e.pointerId===stick.pointer)resetStick();});

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let selectedMesh = null;


renderer.domElement.addEventListener('pointerdown',e=>{
 if(dragging||riding||transitioning)return;
 lookPointer=e.pointerId;renderer.domElement.setPointerCapture(e.pointerId);
 dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===lookPointer){dragging=false;lookPointer=null;}});

addEventListener('pointermove', e => {
  if(!dragging||riding||e.pointerId!==lookPointer)return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  yaw -= dx * 0.0042;
  pitch = Math.max(-1.35, Math.min(1.35, pitch - dy * 0.0042));
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!dragging||e.pointerId!==lookPointer)return;
  dragging=false;lookPointer=null;
  if (moved > 8 || riding) return;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects(productMeshes, false);
  if (hits.length) { selectProduct(hits[0].object); return; }

  const dhits = raycaster.intersectObjects(doors, false);
  if (dhits.length) {
    const d = dhits[0].object;
    if (d.userData.isExit) teleport('mall');
    else if (d.userData.store?.open) teleport('shop');
    else showToast('🔒 هذا المحل قريبًا — ترقبوا الافتتاح!');
    return;
  }

  const ahits = raycaster.intersectObjects(adScreens, false);
  if (ahits.length) {
    const ad = ahits[0].object.userData.ad;
    if (ad.url && ad.url !== '#') window.open(ad.url, '_blank');
    else showToast('📢 هذه المساحة الإعلانية متاحة للتأجير!');
    return;
  }
  closePanel();
});

function showToast(msg) {

}

const clock = new THREE.Clock();
const EYE = 1.7;
const RIDE_TIME = 5;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // نبض واجهات المحلات
  neonPulses.forEach((p, i) => { p.mesh.material.opacity = p.base + Math.sin(t * 2 + i) * (p.open ? 0.15 : 0.06); });

  // حركة درجات السلم الكهربائي
  escSteps.forEach(s => {
    const prog = ((t * 0.12) + s.off) % 1;
    const zz = s.goingUp ? ESC.zBot + (ESC.zTop - ESC.zBot) * prog : ESC.zTop + (ESC.zBot - ESC.zTop) * prog;
    const yy = LEVEL_Y * (s.goingUp ? prog : 1 - prog);
    s.mesh.position.set(0,yy-.08,zz);
  });

  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 8 : 4;

  /* ===== ركوب السلم ===== */
  if (riding) {
    riding.t += dt / RIDE_TIME;
    const k = Math.min(riding.t, 1);
    const ease = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2; // ease in-out
    camera.position.x = riding.from.x;
    camera.position.z = riding.from.z + (riding.to.z - riding.from.z) * ease;
    const baseY=LEVEL_Y*(riding.up?ease:1-ease);
    camera.position.y = baseY + EYE + Math.sin(t * 8) * 0.02;
    // وجّه الكاميرا لاتجاه الحركة
    yaw=riding.up?0:Math.PI;
    pitch = -0.25;
    if (k >= 1) {

      const wasUp=riding.up;floor=wasUp?1:0;
      camera.position.z=wasUp?ESC.zTop-1.25:ESC.zBot+1.25;
      camera.position.y=LEVEL_Y*floor+EYE;
      riding=null;
      pitch = 0;
      updateBadge();
    }
  } else {
    /* ===== مشي عادي ===== */
    if (zone === 'mall') {
      // مناطق صعود/نزول السلم
      const p = camera.position;
      if (floor === 0 && Math.abs(p.x-ESC.xUp)<.7&&Math.abs(p.z-(ESC.zBot+.65))<.8) startRide(true);
      else if (floor === 1 && Math.abs(p.x-ESC.xDown)<.7&&Math.abs(p.z-(ESC.zTop-.65))<.8) startRide(false);
    }

    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx =  Math.cos(yaw), rz = -Math.sin(yaw);
    let mx=rx*stick.x-fx*stick.y,mz=rz*stick.x-fz*stick.y;
    if (keys['KeyW'] || keys['ArrowUp'])    { mx += fx; mz += fz; }
    if (keys['KeyS'] || keys['ArrowDown'])  { mx -= fx; mz -= fz; }
    if (keys['KeyD'] || keys['ArrowRight']) { mx += rx; mz += rz; }
    if (keys['KeyA'] || keys['ArrowLeft'])  { mx -= rx; mz -= rz; }

    if(riding||transitioning||document.getElementById("panel").classList.contains("open")){mx=0;mz=0;}
    const len=Math.hypot(mx,mz);
    if (len > 0) {
      camera.position.x += (mx/Math.max(1,len))*speed*dt;
      camera.position.z += (mz/Math.max(1,len))*speed*dt;
      bobT += dt * speed * 2.2;
    }

    if (zone === 'mall') {
      camera.position.x = Math.max(-(HALL_W/2 - 1), Math.min(HALL_W/2 - 1, camera.position.x));
      camera.position.z = Math.max(-(HALL_L/2 - 1.5), Math.min(HALL_L/2 - 1.5, camera.position.z));
      // منع السقوط من فتحة الـ Atrium في الطابق الأول
      if (floor === 1) {
        const p = camera.position;
        if (Math.abs(p.x)<3.2&&p.z>-2.2&&p.z<8.3) {
          // ادفعه لأقرب حافة
          const dl = p.x - (-3.2), dr = 3.2 - p.x, db = p.z + 2.2, df = 8.3 - p.z;
          const m = Math.min(dl, dr, db, df);
          if (m === dl) p.x = -3.2; else if (m === dr) p.x = 3.2;
          else if (m === db) p.z = -2.2; else p.z = 8.3;
        }
      }
      camera.position.y = LEVEL_Y * floor + EYE + Math.sin(bobT) * 0.045;
    } else {
      camera.position.x = Math.max(200 - 7.5, Math.min(200 + 7.5, camera.position.x));
      camera.position.z = Math.max(-7.5, Math.min(7.5, camera.position.z));
      camera.position.y = EYE + Math.sin(bobT) * 0.045;
    }
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  }

  camera.rotation.y=yaw;camera.rotation.x=pitch;
  renderer.render(scene,camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setTimeout(() => {
  const l = document.getElementById('loader');
  l.style.opacity = 0;
  setTimeout(() => l.remove(), 800);
}, 1000);
</script>
