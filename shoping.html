<script type="module">

let products = [

  { id:"s3",  name:"سماعة ألعاب RGB",          price:229, cat:"سماعات",       icon:"🎧", color:0xff2fd6, desc:"سماعة قيمنق بصوت محيطي 7.1 ومايك بإلغاء الضوضاء وإضاءة RGB متزامنة." },
  { id:"c1",  name:"شاحن سريع 65W",            price:99,  cat:"شواحن",        icon:"🔌", color:0x00f0ff, desc:"شاحن GaN صغير بقوة 65 واط يشحن الجوال واللابتوب، بمنفذين USB-C وUSB-A." },
  { id:"c2",  name:"كيبل مغناطيسي 3 في 1",     price:39,  cat:"شواحن",        icon:"🔌", color:0x7b2ff7, desc:"كيبل شحن مغناطيسي يدعم Lightning وUSB-C وMicro بطول 2 متر وقوة 100W." },
  { id:"c3",  name:"باور بانك 20000mAh",       price:129, cat:"شواحن",        icon:"🔋", color:0x00ff9d, desc:"بطارية متنقلة بسعة كبيرة وشاشة عرض رقمية، تشحن 3 أجهزة بنفس الوقت." },
  { id:"g1",  name:"حماية شاشة سيراميك",       price:35,  cat:"حماية",        icon:"🛡️", color:0xffe600, desc:"استيكر حماية سيراميك ناعم الملمس، مضاد للخدوش والبصمات وتركيب سهل." },

  { id:"a1",  name:"حامل سيارة مغناطيسي",      price:49,  cat:"إكسسوارات",    icon:"🚗", color:0x7b2ff7, desc:"حامل مغناطيسي قوي للسيارة مع دوران 360 درجة، ثبات عالي على الطريق." },
  { id:"a2",  name:"حامل مكتب ألمنيوم",        price:55,  cat:"إكسسوارات",    icon:"🖥️", color:0x00ff9d, desc:"حامل مكتبي من الألمنيوم بزوايا قابلة للتعديل، متوافق مع الجوال والتابلت." },
  { id:"a3",  name:"قلم لمس ذكي",              price:89,  cat:"إكسسوارات",    icon:"✏️", color:0xffe600, desc:"قلم Stylus بدقة عالية وبطارية تدوم 10 ساعات، مثالي للرسم والتدوين." },
  { id:"a4",  name:"استيكرات سكين نيون",       price:19,  cat:"إكسسوارات",    icon:"✨", color:0xff2fd6, desc:"حزمة استيكرات مقاومة للماء بتصاميم نيون، تناسب الجوال واللابتوب." },
  { id:"a5",  name:"كفر تبريد للقيمنق",        price:75,  cat:"كفرات",        icon:"🎮", color:0x00f0ff, desc:"كفر بشريط تبريد نحاسي يخفض حرارة الجوال أثناء الألعاب الطويلة." },
  { id:"a6",  name:"سبيكر بلوتوث محمول",       price:119, cat:"سماعات",      icon:"🔊", color:0x7b2ff7, desc:"مكبر صوت صغير بصوت قوي 360 درجة وبطارية 12 ساعة ومقاومة للماء." },
];
/* ============================================================
   ⬇️ نهاية قائمة المنتجات
   ============================================================ */

// ---------- المشهد الأساسي ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);
scene.fog = new THREE.Fog(0x050508, 25, 60);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 200);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.7, -5); // مستوى عين الإنسان

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

// ---------- نظام المشي (FPS-style) ----------
let yaw = 0;      // نبدأ واجهين الجدار الخلفي فيه الأرفف؟ لا — نبدأ واجهين المحل
let pitch = 0;
const keys = {};
let bobT = 0;

addEventListener('keydown', e => {
 if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
 if(e.code === 'Escape') { closePanel(); return; }
 if(e.code === 'KeyE' && hoveredMesh) { selectProduct(hoveredMesh); return; }
 if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].includes(e.code)){e.preventDefault();keys[e.code]=true;}
});
addEventListener('blur',clearMovement);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearMovement();});
function clearMovement(){for(const k in keys)keys[k]=false;dragging=false;}

addEventListener('keyup',   e => { keys[e.code] = false; });

// السحب للنظر حولك (بدون ما نخسر الضغط على المنتجات)
let dragging = false, lastX = 0, lastY = 0, moved = 0;

function onPointerDown(e) {
  if (document.getElementById("panel").classList.contains("open")) closePanel();
  renderer.domElement.setPointerCapture(e.pointerId);
  dragging = true;
  moved = 0;
  lastX = e.clientX; lastY = e.clientY;
}
function onPointerMove(e) {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  yaw   -= dx * 0.0042;
  pitch -= dy * 0.0042;
  pitch = Math.max(-1.35, Math.min(1.35, pitch)); // ما تنقلب الكاميرا
  lastX = e.clientX; lastY = e.clientY;
}
function onPointerUp(e) {
  dragging = false;
  // إذا ما تحرك المؤشر تقريبًا = ضغطة → نفحص المنتجات
  if (moved > 8) return;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(productMeshes, false);
  if (hits.length) selectProduct(hits[0].object);
  else closePanel();
}

renderer.domElement.addEventListener('pointerdown', onPointerDown);
addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerup', onPointerUp);
renderer.domElement.addEventListener('pointercancel',()=>{dragging=false;});

// ---------- الإضاءة ----------
scene.add(new THREE.AmbientLight(0x223344, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(8, 14, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
scene.add(key);

const neonPink = new THREE.PointLight(0xff2fd6, 60, 30); neonPink.position.set(-8, 5, -4); scene.add(neonPink);
const neonCyan = new THREE.PointLight(0x00f0ff, 60, 30); neonCyan.position.set(8, 5, -4); scene.add(neonCyan);
const neonViolet = new THREE.PointLight(0x7b2ff7, 50, 25); neonViolet.position.set(0, 6, 6); scene.add(neonViolet);

// ---------- الأرضية العاكسة ----------
const floor = new Reflector(new THREE.PlaneGeometry(60, 60), {
  clipBias: 0.003,
  textureWidth: Math.min(1024, innerWidth),
  textureHeight: Math.min(1024, innerHeight),
  color: 0x101018
});
floor.rotation.x = -Math.PI/2;
scene.add(floor);

const glass = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color:0x05050a, transparent:true, opacity:0.82, roughness:0.4, metalness:0.6 })
);
glass.rotation.x = -Math.PI/2;
glass.position.y = 0.01;
glass.receiveShadow = true;
scene.add(glass);

const grid = new THREE.GridHelper(60, 60, 0x00f0ff, 0x131320);
grid.material.transparent = true;
grid.material.opacity = 0.15;
grid.position.y = 0.02;
scene.add(grid);

// ---------- الجدران ----------
const wallMat = new THREE.MeshStandardMaterial({ color:0x0b0b14, roughness:0.9, side:THREE.BackSide });
const walls = new THREE.Mesh(new THREE.BoxGeometry(34, 12, 34), wallMat);
walls.position.y = 6;
scene.add(walls);

function neonStrip(w, h, d, x, y, z, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color }));
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}

function makeSign(text, color, size=90) {
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.font = `bold ${size}px Tahoma`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = 40;
  ctx.fillStyle = color;
  ctx.fillText(text, 512, 128);
  const tex = new THREE.CanvasTexture(cv);
  return new THREE.Mesh(new THREE.PlaneGeometry(10, 2.5),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true, side:THREE.DoubleSide }));
}

function makeShelfUnit(x, z, rotY, catName, catColor) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rotY;

  const frameMat = new THREE.MeshStandardMaterial({ color:0x14141f, roughness:0.6, metalness:0.5 });
  const back = new THREE.Mesh(new THREE.BoxGeometry(5, 4.4, 0.15), frameMat);
  back.position.y = 2.2; back.castShadow = back.receiveShadow = true;
  g.add(back);

  const edge = new THREE.Mesh(new THREE.BoxGeometry(5.15, 4.55, 0.08),
    new THREE.MeshBasicMaterial({ color:catColor }));
  edge.position.set(0, 2.2, -0.06);
  g.add(edge);

  for (let i = 0; i < 3; i++) {
    const sh = new THREE.Mesh(new THREE.BoxGeometry(5, 0.1, 1.1),
      new THREE.MeshStandardMaterial({ color:0x1c1c2a, roughness:0.4, metalness:0.7 }));
    sh.position.set(0, 0.9 + i * 1.6, 0.5);
    sh.castShadow = sh.receiveShadow = true;
    g.add(sh);
  }

  const catSign = makeSign(catName, '#'+catColor.toString(16).padStart(6,'0'), 80);
  catSign.scale.set(0.35, 0.35, 0.35);
  catSign.position.set(0, 4.9, 0.3);
  g.add(catSign);
  g.userData.sign=catSign;

  scene.add(g);
  return g;
}

function productImage(p){return safeURL(p.image)||demoImage(p);}
function makeCardTexture(p){
 const cv=document.createElement('canvas');cv.width=512;cv.height=640;
 const ctx=cv.getContext('2d');
 const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;
 function paint(img){
  if(tex.userData.disposed)return;
  ctx.fillStyle='#edf2f8';ctx.fillRect(0,0,512,640);
  if(img){
   const s=Math.min(456/img.width,428/img.height);
   ctx.drawImage(img,(512-img.width*s)/2,20+(428-img.height*s)/2,img.width*s,img.height*s);
  }else{ctx.fillStyle='#718298';ctx.font='24px Tahoma';ctx.textAlign='center';ctx.fillText('جاري تحميل الصورة',256,225);}
  ctx.fillStyle='#101b2e';ctx.fillRect(0,466,512,174);
  ctx.textAlign='center';ctx.direction='rtl';ctx.fillStyle='#f4f8ff';ctx.font='bold 27px Tahoma';
  let label=p.name;while(ctx.measureText(label).width>465&&label.length>2)label=label.slice(0,-2)+'…';
  ctx.fillText(label,256,515);
  ctx.fillStyle='#00f0ff';ctx.font='bold 35px Tahoma';ctx.fillText(p.price+' ر.س',256,563);
  ctx.fillStyle='#a8bdd3';ctx.font='20px Tahoma';ctx.fillText(safeURL(p.image)?p.cat:'رسم تجريبي · '+p.cat,256,606);
  tex.needsUpdate=true;
 }
 paint();
 const img=new Image();img.crossOrigin='anonymous';
 img.onload=()=>paint(img);
 img.onerror=()=>{img.onerror=null;img.src=demoImage(p);};
 img.src=productImage(p);
 return tex;
}
function addProductToShelf(group,product,shelfIndex,slotIndex){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(1.18,1.45,.10),new THREE.MeshStandardMaterial({color:0x152035,emissive:product.color||0x00f0ff,emissiveIntensity:.25,roughness:.5}));
 mesh.position.set(-1.65+slotIndex*1.65,1.7+shelfIndex*1.6,.72);
 mesh.userData.product=product;group.add(mesh);productMeshes.push(mesh);
 const front=new THREE.Mesh(new THREE.PlaneGeometry(1.10,1.375),new THREE.MeshBasicMaterial({map:makeCardTexture(product)}));
 front.position.z=.056;front.userData.product=product;front.userData.cardParent=mesh;mesh.add(front);productMeshes.push(front);
 const base=new THREE.Mesh(new THREE.BoxGeometry(1.27,.055,.35),new THREE.MeshBasicMaterial({color:product.color||0x00f0ff}));
 base.position.y=-.75;mesh.add(base);
}

let page=0,filtered=[],pageSize=36;
let hoveredMesh=null;
function removeCards(){
 const roots=productMeshes.filter(m=>!m.userData.cardParent);
 for(const mesh of roots){mesh.parent.remove(mesh);mesh.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map){o.material.map.userData.disposed=true;o.material.map.dispose();}o.material.dispose();}});}
 productMeshes.length=0;selectedMesh=null;hoveredMesh=null;
}
function updateCategory(){
 const select=document.getElementById('category');const previous=select.value;
 select.replaceChildren(new Option('كل الأقسام',''));
 [...new Set(products.map(p=>p.cat))].forEach(cat=>select.add(new Option(cat,cat)));
 if([...select.options].some(o=>o.value===previous))select.value=previous;
}
function renderProducts(){
 closePanel();removeCards();
 const query=document.getElementById('search').value.trim().toLocaleLowerCase('ar');
 const cat=document.getElementById('category').value;
 filtered=products.filter(p=>(!cat||p.cat===cat)&&(!query||(p.name+' '+p.desc+' '+p.cat).toLocaleLowerCase('ar').includes(query)));
 const total=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.max(0,Math.min(page,total-1));
 const visible=filtered.slice(page*pageSize,(page+1)*pageSize);
 units.forEach((u,index)=>{
  const list=visible.filter((p,i)=>i%units.length===index);
  const old=u.userData.sign;if(old){u.remove(old);old.geometry.dispose();old.material.map.dispose();old.material.dispose();}
  const label=list.length?([...new Set(list.map(p=>p.cat))].length===1?list[0].cat:'مختارات'):'WESAM';
  const sign=makeSign(label,'#8be9fd',80);sign.scale.setScalar(.35);sign.position.set(0,4.9,.3);u.add(sign);u.userData.sign=sign;
 });
 visible.forEach((p,i)=>{const local=Math.floor(i/units.length);addProductToShelf(units[i%units.length],p,Math.floor(local/3),local%3);});
 document.getElementById('shown').textContent=visible.length+' / '+products.length;
 document.getElementById('page-label').textContent=(page+1)+' / '+total;
 document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page>=total-1;
 document.getElementById('status').textContent=filtered.length?filtered.length+' منتج · اضغط الصورة أو وجّه المؤشر واضغط E · اسحب للنظر حولك':'لا توجد منتجات مطابقة. جرّب بحثاً آخر.';
}

document.getElementById('product-file').onchange=async(e)=>{
 const file=e.target.files[0];if(!file)return;
 try{
  if(file.size>5*1024*1024)throw new Error('حجم الملف أكبر من 5 ميجابايت.');
  const data=JSON.parse(await file.text());const rows=Array.isArray(data)?data:data.products;
  if(!Array.isArray(rows)||!rows.length||rows.length>2000)throw new Error('استخدم قائمة تحتوي من 1 إلى 2000 منتج.');
  const seen=new Set();
  const parsed=rows.map((p,i)=>{
   if(!p||typeof p.name!=='string'||!p.name.trim()||!Number.isFinite(p.price)||p.price<0)throw new Error('راجع اسم وسعر المنتج رقم '+(i+1));
   const id=String(p.id??i+1);if(seen.has(id))throw new Error('معرّف المنتج مكرر: '+id);seen.add(id);
   return{id,name:p.name.slice(0,120),price:p.price,cat:String(p.cat||'إكسسوارات').slice(0,50),desc:String(p.desc||'').slice(0,2000),image:safeURL(p.image),url:safeURL(p.url),color:0x00f0ff};
  });
  products=parsed;if(!Array.isArray(data))storeUrl=safeURL(data.storeUrl);page=0;document.getElementById('search').value='';document.getElementById('category').value='';updateCategory();renderProducts();
  document.getElementById('status').textContent='تم استيراد '+products.length+' منتج لهذه الجلسة. احتفظ بملف المنتجات لإعادة تحميله.';
 }catch(err){document.getElementById('status').textContent='لم يتم الاستيراد: '+err.message;}
 e.target.value='';
};

const obstacles=units.map(u=>{
 u.updateMatrixWorld(true);
 const box=new THREE.Box3();
 for(const x of [-2.65,2.65])for(const z of [-.2,1.15])box.expandByPoint(u.localToWorld(new THREE.Vector3(x,0,z)));

function blocked(x,z){return obstacles.some(b=>x>b.min.x-.35&&x<b.max.x+.35&&z>b.min.z-.35&&z<b.max.z+.35);}
let hoverTimer=0;
// ---------- الحلقة ----------
const clock = new THREE.Clock();
const EYE = 1.7;
const ROOM = 15; // حدود المحل

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // نبض الإضاءة النيون
  neonPink.intensity = 55 + Math.sin(t * 2.1) * 12;
  neonCyan.intensity = 55 + Math.sin(t * 1.7 + 1) * 12;
  neonViolet.intensity = 45 + Math.sin(t * 2.6 + 2) * 10;

  // ====== الحركة WASD ======
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 8 : 4;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);        // للأمام
  const rx =  Math.cos(yaw), rz = -Math.sin(yaw);        // لليمين

  let mx = 0, mz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    { mx += fx; mz += fz; }
  if (keys['KeyS'] || keys['ArrowDown'])  { mx -= fx; mz -= fz; }
  if (keys['KeyD'] || keys['ArrowRight']) { mx += rx; mz += rz; }
  if (keys['KeyA'] || keys['ArrowLeft'])  { mx -= rx; mz -= rz; }

  if(document.getElementById("panel").classList.contains("open")){mx=0;mz=0;}
  const len = Math.hypot(mx, mz);
  if (len > 0) {
    camera.position.x += (mx / len) * speed * dt;
    camera.position.z += (mz / len) * speed * dt;
    bobT += dt * speed * 2.2; // اهتزاز خفيف أثناء المشي
  }

  // حدود المحل (ما تطلع من الجدران)
  camera.position.x = Math.max(-ROOM, Math.min(ROOM, camera.position.x));
  camera.position.z = Math.max(-ROOM, Math.min(ROOM, camera.position.z));

  camera.position.y = EYE + Math.sin(bobT) * 0.045;
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;


  hoverTimer+=dt;
  if(hoverTimer>.12){
   hoverTimer=0;camera.updateMatrixWorld();raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
   const hits=raycaster.intersectObjects(productMeshes,false);hoveredMesh=hits.length?hits[0].object:null;
   const hover=document.getElementById('hover');hover.style.display=hoveredMesh&&!document.getElementById('panel').classList.contains('open')?'block':'none';
   if(hoveredMesh)hover.textContent=hoveredMesh.userData.product.name+' · '+hoveredMesh.userData.product.price+' ر.س';
  }
  renderer.render(scene, camera);
}
animate();
